# AS70S2SF2FA-B (Flexis, 7 kW). Copied from AS25/35/50S2SF2FA: same codes are expected,
# not yet confirmed on a live unit.
command_name: "4"
attributes:
  - name: current_temperature
    id: "36"
  - name: target_temperature
    id: "0"
  - name: status
    id: "21"
  - name: mode
    id: "2"
    mappings:
      - haier: "0"
        value: "auto"
      - haier: "1"
        value: "cool"
      - haier: "2"
        value: "dry"
      - haier: "4"
        value: "heat"
      - haier: "6"
        value: "fan_only"
  - name: fan_mode
    id: "4"
    mappings:
      - haier: "1"
        value: "high"
      - haier: "2"
        value: "medium"
      - haier: "3"
        value: "low"
      - haier: "5"
        value: "auto"
